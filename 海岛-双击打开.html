        </div>
        <div class="slider-heading"><label for="time">日光时刻</label><output for="time" id="time-value">17:39</output></div>
        <input id="time" type="range" min="0" max="23.99" step="0.01" value="17.65" aria-label="日光时刻" />
        <div class="time-marks"><span>午夜</span><span>日出</span><span>正午</span><span>日落</span><span>午夜</span></div>
        <div class="environment-sliders">
          <div><div class="slider-heading"><label for="waves">海浪强度</label><output id="waves-value">0.72</output></div><input id="waves" type="range" min="0.1" max="2" step="0.01" value="0.72" /></div>
          <div><div class="slider-heading"><label for="wind">海风</label><output id="wind-value">0.65</output></div><input id="wind" type="range" min="0" max="2" step="0.01" value="0.65" /></div>
        </div>
        <div class="panel-settings"><label class="switch-label"><input id="cycle" type="checkbox" checked/><span class="switch"></span>昼夜流转</label><label class="quality-label" for="quality">画质<select id="quality"><option value="high">高</option><option value="medium" selected>平衡</option><option value="low">流畅</option></select></label></div>
        <div class="panel-footer"><span class="status-dot"></span><span id="weather-description">落日微风 · 温柔涌浪</span><span id="weather-code">01</span></div>
      </div>
    </aside>
    <footer><div class="controls-hint"><span><svg viewBox="0 0 20 20"><rect x="5" y="2" width="10" height="16" rx="5"/><path d="M10 2v6"/></svg>拖动环绕</span><span class="hint-divider"></span><span>滚轮缩放</span><span class="hint-divider"></span><span>右键平移</span></div><div class="utility"><button id="pause" title="暂停动画（空格）" aria-label="暂停动画">Ⅱ</button><button id="reset" title="重置视角" aria-label="重置视角">↺</button><button id="capture" title="保存画面" aria-label="保存画面"><svg viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4Z"/><circle cx="12" cy="13" r="4"/></svg></button><button id="hide" title="隐藏界面（H 恢复）" aria-label="隐藏界面"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></footer>
  </div>
  <button id="restore-ui" hidden>显示界面 <kbd>H</kbd></button>
  <div id="toast" role="status"></div>
</body>
</html>
